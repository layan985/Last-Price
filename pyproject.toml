[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "last-price"
version = "0.2.0"
description = "Experimental infrastructure for measuring model-mediated bargaining, price incidence, and experienced inflation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Layan Aloreidi"}]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
analytics = ["scikit-learn>=1.4", "streamlit>=1.35", "matplotlib>=3.8"]

[project.scripts]
lastprice = "lastprice.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
