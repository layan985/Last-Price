[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "last-price"
version = "0.2.0"
description = "Production-style marketplace ML system built around the Last Price bargaining experiment."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Layan Oraidi"}]
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "scipy==1.17.0",
  "joblib==1.5.3",
  "fastapi==0.128.2",
  "pydantic==2.13.4",
  "uvicorn==0.48.0",
  "Pillow==12.3.0"
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1", "ruff==0.16.2", "mypy==2.3.0"]
mlops = ["mlflow>=2.12", "evidently>=0.4"]
sql = ["duckdb>=1.0"]
voice = ["openai-whisper>=20231117"]
glee = ["glee-sdk"]

[project.scripts]
last-price = "last_price.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
