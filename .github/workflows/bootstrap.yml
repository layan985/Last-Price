name: ruff-safe-autofix

on:
  push:
    branches: ["agent/production-ml-build"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Apply Ruff safe fixes
        run: ruff check --fix src tests scripts || true
      - name: Commit safe lint fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          git diff --cached --quiet || git commit -m "Apply Ruff safe fixes"
          git push
