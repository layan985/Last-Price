name: bootstrap-production-build

on:
  push:
    branches: ["agent/production-ml-build"]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Expand validated repository
        run: python bootstrap_repo.py
      - name: Replace bootstrap payload with project
        run: |
          rm -f bootstrap_repo.py .github/workflows/ci.yml
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Build production ML portfolio system"
          git push
